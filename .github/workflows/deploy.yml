name: Deploy SENTURION

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Runner: $(hostname)"
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build Quasar
        run: npm run build

      - name: Deploy to web directory
        run: |
          TARGET="/www/wwwroot/senturion.udumbara.my.id"

          echo "Deploying SENTURION..."

          rm -rf "$TARGET/assets"
          rm -rf "$TARGET/icons"
          rm -f "$TARGET/index.html"
          rm -f "$TARGET/favicon.ico"

          cp -a dist/spa/. "$TARGET/"

          echo "Deployment completed."

      - name: Show deployed files
        run: |
          ls -lah /www/wwwroot/senturion.udumbara.my.id
